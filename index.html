<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="7-4 班多项式项目中转站，汇集宝可梦数学游戏和小组的游戏与文件。">
<title>多项式中转站 · 7-4 数学项目</title>
<style>
:root{color-scheme:dark;--ink:#f5f3ff;--muted:#c4c4df;--line:#ffffff25;--lime:#dcff82;--lav:#cebdff}
*{box-sizing:border-box}
body{margin:0;background:#131326;color:var(--ink);font:16px/1.65 system-ui,sans-serif}
.wrap{width:min(1080px,calc(100% - 40px));margin:auto}
a{color:inherit;text-decoration:none}a:focus-visible{outline:3px solid var(--lime);outline-offset:5px}
header{border-bottom:1px solid var(--line)}
nav{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 0}
nav span{display:flex;gap:20px;font-size:.9rem}nav a:hover{color:var(--lime)}
.brand{font-weight:800}.brand b{color:var(--lime);margin-right:8px}
.hero{overflow:hidden;background:radial-gradient(ellipse at 85% 44%,#322654,transparent 65%),linear-gradient(#ffffff0b 1px,transparent 1px),linear-gradient(90deg,#ffffff0b 1px,transparent 1px);background-size:auto,32px 32px,32px 32px;border-bottom:1px solid var(--line)}
.hero .wrap{display:grid;grid-template-columns:1.2fr 1fr;align-items:center;gap:26px;min-height:395px;padding:55px 0}
.eyebrow{color:var(--lime);font-weight:800;letter-spacing:.13em;font-size:.83rem}
h1{font-size:clamp(2.5rem,7vw,5.1rem);line-height:1.1;letter-spacing:-.05em;margin:12px 0 22px}
p{color:var(--muted);margin:0} .hero p{max-width:36ch}
.formula{justify-self:center;max-width:100%;font:bold clamp(1.35rem,4.3vw,3rem)/1.3 ui-monospace,monospace;padding:22px 24px;border:1px solid #9b83ce;border-radius:20px;background:#242039;box-shadow:9px 9px 0 #56447b;white-space:nowrap;color:var(--lav);transform:rotate(-5deg)}
.formula b{color:var(--lime)}
section{padding:38px 0}h2{font-size:1.6rem;margin:0 0 17px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{display:flex;flex-direction:column;min-height:240px;padding:24px;border-radius:20px;border:1px solid var(--line);background:#202039;transition:transform .18s,border-color .18s}
.card:hover{transform:translateY(-4px);border-color:var(--accent)}
.card:first-child{--accent:var(--lime)}.card:last-child{--accent:var(--lav)}
.icon{font-size:1.4rem;color:var(--accent);line-height:1;background:#ffffff0d;border-radius:12px;padding:11px;align-self:flex-start}
.card h3{margin:12px 0 2px;font-size:1.35rem}
.cta{color:var(--accent);font-weight:750;margin-top:auto;padding-top:20px}
.team{border-top:1px solid var(--line)}
ul{display:flex;flex-wrap:wrap;gap:10px;list-style:none;padding:0;margin:16px 0 0}
li{padding:7px 15px;border:1px solid var(--line);border-radius:99px;background:#202039}
footer{padding:20px 0;border-top:1px solid var(--line);color:var(--muted);font-size:.88rem}
@media(max-width:640px){.hero .wrap,.cards{grid-template-columns:1fr}.hero .wrap{min-height:0;padding:38px 0}.formula{justify-self:start;margin:6px 4px 10px}.card{min-height:210px}}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<header><nav class="wrap" aria-label="站内导航"><a href="#" class="brand"><b aria-hidden="true">ƒ(x)</b>多项式项目</a><span><a href="#links">项目入口</a><a href="#team">小组成员</a></span></nav></header>
<main>
<div class="hero"><div class="wrap">
<div><div class="eyebrow">7-4 班 · 数学小组项目</div><h1>多项式中转站</h1><p>我们把课堂上的多项式做成了游戏，也把小组的游戏和项目文件集中在这里。选一个入口开始探索。</p></div>
<div class="formula" aria-label="x 的平方加五 x 加六"><b>x²</b> + 5x + 6</div>
</div></div>
<section class="wrap" id="links"><h2>项目入口</h2>
<div class="cards">
<a class="card" href="https://polynomial-pokemon-game.ok.kimi.link"><span class="icon" aria-hidden="true">⚡</span><h3>多项式宝可梦</h3><p>进入宝可梦主题的多项式数学游戏。</p><span class="cta">开始游戏 ↗</span></a>
<a class="card" href="https://poynomial-game-7-4.kimi.site"><span class="icon" aria-hidden="true">▤</span><h3>游戏与项目文件</h3><p>浏览小组前面做的几个游戏和项目文件。</p><span class="cta">打开合集 ↗</span></a>
</div></section>
<section class="wrap team" id="team"><h2>小组成员</h2><p>我们七个人一起完成了这个多项式项目。</p>
<ul><li>Allan</li><li>Junyi</li><li>Jimmy</li><li>Sherry</li><li>Cynthia</li><li>August</li><li>Lucas</li></ul>
</section>
</main>
<footer><div class="wrap">7-4 班 · 多项式项目</div></footer>
</body>
</html>
